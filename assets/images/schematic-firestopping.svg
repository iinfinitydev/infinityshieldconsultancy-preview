<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t3">
  <title id="t3">Fire-stopping schematic — penetration sealed through a compartment wall</title>
  <rect width="600" height="400" fill="#f3ece0"/>
  <!-- wall -->
  <rect x="248" y="48" width="104" height="300" fill="#e4d7bc" stroke="#1c1914" stroke-width="3"/>
  <rect x="248" y="48" width="10" height="300" fill="#b8962e"/>
  <rect x="342" y="48" width="10" height="300" fill="#b8962e"/>
  <!-- opening -->
  <rect x="248" y="148" width="104" height="96" fill="#f3ece0" stroke="#1c1914" stroke-width="2"/>
  <!-- firestop hatch -->
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b8962e" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="252" y="152" width="96" height="88" fill="url(#hatch)" stroke="#8f731f" stroke-width="2"/>
  <!-- pipes -->
  <rect x="140" y="168" width="320" height="18" rx="9" fill="#cfc3a8" stroke="#1c1914" stroke-width="2"/>
  <rect x="140" y="206" width="320" height="14" rx="7" fill="#cfc3a8" stroke="#1c1914" stroke-width="2"/>
  <rect x="160" y="236" width="280" height="10" rx="5" fill="#cfc3a8" stroke="#1c1914" stroke-width="2"/>
  <text x="300" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="3" fill="#8f731f">FIRE-STOPPING</text>
</svg>
