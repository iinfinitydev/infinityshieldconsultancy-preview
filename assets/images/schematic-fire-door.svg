<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t1">
  <title id="t1">Fire door schematic — closer body on the leaf, arm fixed to the frame</title>
  <rect width="600" height="400" fill="#f3ece0"/>
  <!-- frame -->
  <rect x="168" y="48" width="264" height="312" fill="none" stroke="#1c1914" stroke-width="10"/>
  <rect x="184" y="64" width="232" height="280" fill="#efe6d4" stroke="#1c1914" stroke-width="3"/>
  <!-- leaf -->
  <rect x="196" y="78" width="208" height="250" fill="#e4d7bc" stroke="#1c1914" stroke-width="3"/>
  <!-- intumescent -->
  <rect x="190" y="72" width="6" height="262" fill="#b8962e"/>
  <rect x="404" y="72" width="6" height="262" fill="#b8962e"/>
  <rect x="190" y="72" width="220" height="6" fill="#b8962e"/>
  <!-- hinges -->
  <rect x="160" y="120" width="18" height="28" fill="#1c1914"/>
  <rect x="160" y="250" width="18" height="28" fill="#1c1914"/>
  <!-- handle -->
  <circle cx="372" cy="210" r="7" fill="none" stroke="#1c1914" stroke-width="3"/>
  <rect x="372" y="207" width="22" height="6" fill="#1c1914"/>
  <!-- closer body on DOOR -->
  <rect x="248" y="86" width="88" height="22" rx="2" fill="#c9a84a" stroke="#1c1914" stroke-width="2"/>
  <!-- arm from body to FRAME HEAD -->
  <path d="M292 86 L292 58 L340 58" fill="none" stroke="#1c1914" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M292 86 L318 58" fill="none" stroke="#1c1914" stroke-width="3"/>
  <!-- shoe on FRAME -->
  <rect x="328" y="50" width="28" height="10" fill="#1c1914"/>
  <text x="300" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="3" fill="#8f731f">FIRE DOOR</text>
</svg>
