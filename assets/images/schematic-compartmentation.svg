<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t2">
  <title id="t2">Compartmentation schematic — fire-resisting walls, floor and shaft</title>
  <rect width="600" height="400" fill="#f3ece0"/>
  <!-- floor slabs -->
  <rect x="70" y="86" width="460" height="22" fill="#d7c9a8" stroke="#1c1914" stroke-width="3"/>
  <rect x="70" y="248" width="460" height="22" fill="#d7c9a8" stroke="#1c1914" stroke-width="3"/>
  <rect x="70" y="318" width="460" height="18" fill="#d7c9a8" stroke="#1c1914" stroke-width="3"/>
  <!-- compartment walls gold -->
  <rect x="70" y="86" width="18" height="250" fill="#b8962e" stroke="#1c1914" stroke-width="2"/>
  <rect x="512" y="86" width="18" height="250" fill="#b8962e" stroke="#1c1914" stroke-width="2"/>
  <rect x="278" y="108" width="18" height="140" fill="#b8962e" stroke="#1c1914" stroke-width="2"/>
  <!-- shaft -->
  <rect x="390" y="108" width="70" height="140" fill="#efe6d4" stroke="#1c1914" stroke-width="3"/>
  <rect x="390" y="108" width="70" height="10" fill="#b8962e"/>
  <rect x="408" y="150" width="34" height="44" fill="none" stroke="#1c1914" stroke-width="2"/>
  <text x="425" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#1c1914">HATCH</text>
  <!-- gold compartment outline -->
  <rect x="64" y="80" width="472" height="262" fill="none" stroke="#b8962e" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="300" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="3" fill="#8f731f">COMPARTMENTATION</text>
</svg>
